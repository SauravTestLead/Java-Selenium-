<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multiple Dropdown with Bootstrap</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container">
    <h2 class="mb-4">Multiple Dropdowns with Duplicate Values</h2>

    <!-- First Dropdown -->
    <div class="mb-3">
        <label for="dropdown1" class="form-label">Select Fruit</label>
        <select class="form-select" id="dropdown1">
            <option>Apple</option>
            <option>Banana</option>
            <option>Orange</option>
            <option>Apple</option> <!-- Duplicate -->
            <option>Mango</option>
            <option>Banana</option> <!-- Duplicate -->
        </select>
    </div>

    <!-- Second Dropdown -->
    <div class="mb-3">
        <label for="dropdown2" class="form-label">Select Color</label>
        <select class="form-select" id="dropdown2">
            <option>Red</option>
            <option>Blue</option>
            <option>Green</option>
            <option>Blue</option> <!-- Duplicate -->
            <option>Yellow</option>
            <option>Green</option> <!-- Duplicate -->
        </select>
    </div>

    <!-- Third Dropdown -->
    <div class="mb-3">
        <label for="dropdown3" class="form-label">Select Car Brand</label>
        <select class="form-select" id="dropdown3">
            <option>Tesla</option>
            <option>BMW</option>
            <option>Audi</option>
            <option>BMW</option> <!-- Duplicate -->
            <option>Mercedes</option>
            <option>Audi</option> <!-- Duplicate -->
        </select>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
