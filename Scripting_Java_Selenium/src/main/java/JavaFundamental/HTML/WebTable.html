<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Automation Tools Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 60%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }
    </style>
</head>

<body>

<h1>Automation Tools Comparison</h1>

<table>
    <tbody>
    <tr>
        <th>Automation Tool</th>
        <th>Licensing</th>
        <th>Market Response</th>
    </tr>

    <tr>
        <td>Selenium</td>
        <td>Free</td>
        <td>In</td>
    </tr>

    <tr>
        <td>QTP</td>
        <td>Paid</td>
        <td>Out</td>
    </tr>
    </tbody>
</table>

</body>
</html>
