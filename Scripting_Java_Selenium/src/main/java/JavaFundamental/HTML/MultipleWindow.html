<!DOCTYPE html>
<html>
<head>
    <title>Simple Three Button Page</title>
    <style>
        body {
            text-align: center;
            margin-top: 100px;
            font-family: Arial, sans-serif;
        }

        .btn {
            display: inline-block;
            padding: 15px 25px;
            margin: 15px;
            font-size: 18px;
            text-decoration: none;
            color: white;
            background-color: #007BFF;
            border-radius: 8px;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<h1>My Navigation Page</h1>

<a href="https://www.google.com" target="_blank" class="btn">Google</a>
<a href="https://www.amazon.com" target="_blank" class="btn">Amazon</a>
<a href="https://www.makemytrip.com" target="_blank" class="btn">MakeMyTrip</a>

</body>
</html>
